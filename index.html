<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>Vitaly Nudelman | Software Developer</title>
    <meta
      name="description"
      content="Vitaly Nudelman - Software Developer with expertise in C++ and DevOps. View my projects, skills, and professional background."
    />
    <meta name="author" content="Vitaly Nudelman" />

    <meta property="og:title" content="Vitaly Nudelman - Software Developer" />
    <meta
      property="og:description"
      content="Software Developer specializing in C++ with experience in DevOps and cloud infrastructure."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vitalynudelman.com" />
    <meta property="og:image" content="/logo512.png" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161a" />

    <!-- Resolve the theme before first paint so nothing flashes the wrong colour. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme = stored || (prefersLight ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
